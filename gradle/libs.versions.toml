[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.12.1"
serialization = "1.11.0"
coroutines = "1.10.2"
activity = "1.13.0"
miuix = "0.9.4"
mariadb = "3.5.3"
mssql = "12.8.1.jre11"
oracle = "23.6.0.24.10"
oracleLegacy = "19.33.0.0"
dameng = "8.1.5.45"
jtds = "1.3.1"
postgresql = "42.7.14"
sqlite = "3.54.1.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
oracle = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle" }
ojdbcLegacy = { module = "com.oracle.database.jdbc:ojdbc8", version.ref = "oracleLegacy" }
dameng = { module = "com.dameng:DmJdbcDriver8", version.ref = "dameng" }
jtds = { module = "net.sourceforge.jtds:jtds", version.ref = "jtds" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
